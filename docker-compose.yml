# Alternative docker-compose for Ubuntu-based image
version: "3.8"

services:
  scraper:
    build:
      context: .
      dockerfile: Dockerfile  # Use the Ubuntu-based Dockerfile
    container_name: newage-price-scraper-ubuntu
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./config:/app/config
    command: >
      sh -c "
        node parallelArchiveScraper.js \
          --start $${START_DATE} \
          --end $${END_DATE} \
          --workers $${WORKERS} \
          --commodities \"$${COMMODITIES}\" \
          --config /app/config/commodities.json
      "
    deploy:
      resources:
        limits:
          memory: 12G
          cpus: '2.0'
    restart: on-failure:3
    shm_size: 2gb
    cap_add:
      - SYS_ADMIN  # Sometimes needed for Chrome
    environment:
      - NODE_OPTIONS=--max-old-space-size=2048